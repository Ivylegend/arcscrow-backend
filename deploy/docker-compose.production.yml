services:
  api:
    build: ..
    env_file: .env
    restart: unless-stopped
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ..
    env_file: .env
    restart: unless-stopped
    command: celery -A app.jobs.celery worker --loglevel=INFO
  beat:
    build: ..
    env_file: .env
    restart: unless-stopped
    command: celery -A app.jobs.celery beat --loglevel=INFO
