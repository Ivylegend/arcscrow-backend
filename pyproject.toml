[project]
name = "arcscrow-backend"
version = "0.1.0"
description = "Arc-native programmable deal execution API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "gunicorn>=23,<24",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "eth-account>=0.13,<1",
  "redis>=6.2,<7",
  "celery>=5.5,<6",
  "boto3>=1.39,<2",
  "httpx>=0.28,<1",
  "structlog>=25.4,<26",
  "prometheus-client>=0.22,<1",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "E501", "S101", "S105", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
